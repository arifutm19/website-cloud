<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cloud Drive Firebase</title>

<style>

body{
font-family:Arial;
background:#f1f3f4;
padding:40px;
}

.container{
max-width:900px;
margin:auto;
}

.box{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
margin-bottom:30px;
}

button{
padding:12px 25px;
background:#1a73e8;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:20px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-body{
padding:15px;
}

.link{
display:block;
margin-top:10px;
font-size:12px;
word-break:break-all;
}

</style>

</head>

<body>

<div class="container">

<div class="box">

<h1>☁️ Cloud Drive Firebase</h1>

<input type="file" id="file">

<br>

<button onclick="uploadImage()">
Upload
</button>

</div>

<div class="gallery" id="gallery"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getStorage,
ref,
uploadBytes,
getDownloadURL
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {

apiKey: "AIzaSyCLYpRNE3jSeZo1SyDjrvFfEQJqMdrllIE",

authDomain: "website-cloud-238ba.firebaseapp.com",

projectId: "website-cloud-238ba",

storageBucket: "website-cloud-238ba.firebasestorage.app",

messagingSenderId: "157352819235",

appId: "1:157352819235:web:879fe46b6bdac594480f96"

};

const app = initializeApp(firebaseConfig);

const storage = getStorage(app);

window.uploadImage = async function(){

const file =
document.getElementById("file").files[0];

if(!file){
alert("Pilih gambar dulu");
return;
}

const storageRef =
ref(storage, "images/" + Date.now() + "-" + file.name);

await uploadBytes(storageRef, file);

const imageUrl =
await getDownloadURL(storageRef);

document.getElementById("gallery").innerHTML += `

<div class="card">

<img src="${imageUrl}">

<div class="card-body">

<button onclick="window.open('${imageUrl}')">
Buka
</button>

<a class="link"
href="${imageUrl}"
target="_blank">

${imageUrl}

</a>

</div>

</div>

`;

alert("Upload berhasil");

}

</script>

</body>

</html>
