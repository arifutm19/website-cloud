<!DOCTYPE html>
<html>

<head>
<title>Cloud Drive</title>

<style>

body{
font-family:Arial;
background:#f1f3f4;
padding:40px;
text-align:center;
}

.box{
background:white;
max-width:500px;
margin:auto;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

button{
padding:10px 20px;
background:#1a73e8;
color:white;
border:none;
border-radius:10px;
margin-top:20px;
cursor:pointer;
}

img{
width:100%;
margin-top:20px;
border-radius:10px;
}

a{
display:block;
margin-top:15px;
word-break:break-all;
}

</style>

</head>

<body>

<div class="box">

<h1>☁️ Cloud Drive</h1>

<input type="file" id="file">

<br><br>

<button onclick="uploadImage()">
Upload
</button>

<img id="preview">

<a id="link" target="_blank"></a>

</div>

<script>

async function uploadImage(){

const file =
document.getElementById("file").files[0];

if(!file){
alert("Pilih gambar dulu");
return;
}

const formData = new FormData();

formData.append("image", file);

const response = await fetch(
"https://api.imgbb.com/1/upload?key=968f9e1ac673826ebcf89d3e3504143a",
{
method:"POST",
body:formData
}
);

const data = await response.json();

const imageUrl = data.data.url;

document.getElementById("preview").src =
imageUrl;

document.getElementById("link").href =
imageUrl;

document.getElementById("link").innerHTML =
imageUrl;

alert("Upload berhasil");

}

</script>

</body>

</html>
