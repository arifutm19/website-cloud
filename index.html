<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Drive Firebase</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f1f3f4;
padding:40px;
}

.container{
max-width:900px;
margin:auto;
}

.header{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:30px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.header h1{
color:#1a73e8;
}

.upload-box{
background:white;
padding:30px;
border-radius:15px;
margin-bottom:30px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

button{
padding:12px 25px;
background:#1a73e8;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:20px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-body{
padding:15px;
}

.link{
display:block;
margin-top:10px;
word-break:break-all;
font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>☁️ Cloud Drive Firebase</h1>
</div>

<div class="upload-box">

<input type="file" id="file">

<br>

<button onclick="uploadImage()">
Upload Gambar
</button>

</div>

<div class="gallery" id="gallery"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getStorage,
ref,
uploadBytes,
getDownloadURL
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {

apiKey: "AIzaSyDEwZOcfrPljCSUCoy-Ppa59LPQdbIcbBs",

authDomain: "website-cloud-c5573.firebaseapp.com",

projectId: "website-cloud-c5573",

storageBucket: "website-cloud-c5573.firebasestorage.app",

messagingSenderId: "523295746487",

appId: "1:523295746487:web:8b719cbb63d3ea5101e032"

};

const app = initializeApp(firebaseConfig);

const storage = getStorage(app);

window.uploadImage = async function(){

const file =
document.getElementById("file").files[0];

if(!file){
alert("Pilih gambar dulu");
return;
}

const storageRef =
ref(storage, "images/" + Date.now() + "-" + file.name);

await uploadBytes(storageRef, file);

const imageUrl =
await getDownloadURL(storageRef);

document.getElementById("gallery").innerHTML += `

<div class="card">

<img src="${imageUrl}">

<div class="card-body">

<button onclick="window.open('${imageUrl}')">
Buka
</button>

<a class="link"
href="${imageUrl}"
target="_blank">

${imageUrl}

</a>

</div>

</div>

`;

alert("Upload berhasil");

}

</script>

</body>
</html>
